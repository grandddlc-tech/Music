<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Music</title>
  <meta name="description" content="Your personal music player that detects the country of every song">
  <meta name="theme-color" content="#0b0b12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" stroke="none" x="6" y="4.5" width="4" height="15" rx="1.3"/><rect fill="currentColor" stroke="none" x="14" y="4.5" width="4" height="15" rx="1.3"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M5 6.2v11.6a1 1 0 0 0 1.53.85l8.6-5.8a1 1 0 0 0 0-1.7l-8.6-5.8A1 1 0 0 0 5 6.2z"/><rect fill="currentColor" stroke="none" x="16.5" y="5" width="2.6" height="14" rx="1.1"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M19 6.2v11.6a1 1 0 0 1-1.53.85l-8.6-5.8a1 1 0 0 1 0-1.7l8.6-5.8A1 1 0 0 1 19 6.2z"/><rect fill="currentColor" stroke="none" x="4.9" y="5" width="2.6" height="14" rx="1.1"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
      <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
      <symbol id="i-heart-fill" viewBox="0 0 24 24"><path fill="currentColor" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle fill="currentColor" cx="5" cy="12" r="1.6"/><circle fill="currentColor" cx="12" cy="12" r="1.6"/><circle fill="currentColor" cx="19" cy="12" r="1.6"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
      <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M6.5 12a5.5 5.5 0 0 1 5.5-5.5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="i-fire" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 4.5l5 15.5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 6h13M3 12h9M3 18h9"/><circle cx="18" cy="17" r="2.5"/><path d="M20.5 17V9h-2"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="m3 16 4 4 4-4M7 20V4M11 4h10M11 8h7M11 12h4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M8 16H3v5"/></symbol>
      <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 12 19 5"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.2" fill="currentColor"/><circle cx="17.5" cy="10.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="7.5" r="1.2" fill="currentColor"/><circle cx="6.5" cy="12.5" r="1.2" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2z"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M10 13h4M7 16h10"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></symbol>
      <symbol id="i-next-up" viewBox="0 0 24 24"><path d="M3 6h12M3 12h12M3 18h7"/><path d="m16 15 4 3-4 3z" fill="currentColor"/></symbol>
      <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h11M18 15v6M15 18h6"/></symbol>
      <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
      <symbol id="i-vol-low" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.54 8.46a5 5 0 0 1 0 7.07"/></symbol>
      <symbol id="i-vol-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/></symbol>
    </defs>
  </svg>

  <div class="bg-glow" aria-hidden="true"></div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a class="brand" href="#/home">
        <span class="logo"><svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#lg)"/><path d="M14 30c3-9 5-14 6-14s2 16 4 16 3-12 5-12 2 7 5 7" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">Music</span>
      </a>
      <nav class="nav">
        <a href="#/home" data-route="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
        <a href="#/search" data-route="search"><svg class="ic"><use href="#i-search"/></svg><span>Search</span></a>
        <a href="#/new" data-route="new"><svg class="ic"><use href="#i-sparkle"/></svg><span>New</span></a>
        <a href="#/countries" data-route="countries"><svg class="ic"><use href="#i-globe"/></svg><span>Countries</span></a>
        <a href="#/library" data-route="library"><svg class="ic"><use href="#i-library"/></svg><span>Library</span></a>
        <a href="#/playlists" data-route="playlists"><svg class="ic"><use href="#i-list"/></svg><span>Playlists</span></a>
        <a href="#/stats" data-route="stats"><svg class="ic"><use href="#i-chart"/></svg><span>Stats</span></a>
        <a href="#/settings" data-route="settings"><svg class="ic"><use href="#i-gear"/></svg><span>Settings</span></a>
      </nav>
      <button class="btn primary add-btn" data-act="add-folder"><svg class="ic"><use href="#i-plus"/></svg><span>Add music</span></button>
      <div id="detect-status" class="detect-status" hidden></div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div class="topbar">
        <div class="searchbox">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search songs, artists, albums or countries…" autocomplete="off">
        </div>
        <button class="icon-btn top-add" data-act="add-folder" title="Add music"><svg class="ic"><use href="#i-plus"/></svg></button>
      </div>
      <div id="access-banner" class="banner" hidden>🔒 To play your songs, confirm access to your music folder again — <b>click here</b></div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Bottom player -->
  <footer id="playerbar" class="playerbar empty">
    <div class="mini-progress"><i id="mini-progress"></i></div>
    <div class="mini-info">
      <div class="cover sm" data-np="cover" data-act="open-np"><span>♪</span></div>
      <div class="mini-text">
        <div class="mini-title" data-np="title">Nothing playing</div>
        <a class="mini-artist" data-np="artist"></a>
      </div>
      <button class="icon-btn like" data-np="like" data-act="like"><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>
    <div class="mini-center">
      <div class="controls">
        <button class="icon-btn sm-hide" data-act="shuffle" title="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn sm-hide" data-act="prev" title="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="play-btn" data-act="toggle" title="Play"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="icon-btn" data-act="next" title="Next"><svg class="ic"><use href="#i-next"/></svg></button>
        <button class="icon-btn sm-hide" data-act="repeat" title="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="timeline sm-hide">
        <span data-np="cur">0:00</span>
        <input type="range" class="seek" min="0" max="1000" value="0" aria-label="Position">
        <span data-np="dur">0:00</span>
      </div>
    </div>
    <div class="mini-right sm-hide">
      <span data-np="country"></span>
      <button class="icon-btn" data-act="sleep" title="Sleep timer"><svg class="ic"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" data-act="mute"><svg class="ic"><use href="#i-vol"/></svg></button>
      <input type="range" class="vol" min="0" max="100" value="90" aria-label="Volume">
      <button class="icon-btn" data-act="open-np" title="Now Playing"><svg class="ic" style="transform:rotate(180deg)"><use href="#i-chev-down"/></svg></button>
    </div>
  </footer>

  <!-- Mobile navigation -->
  <nav class="bottomnav nav">
    <a href="#/home" data-route="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
    <a href="#/new" data-route="new"><svg class="ic"><use href="#i-sparkle"/></svg><span>New</span></a>
    <a href="#/countries" data-route="countries"><svg class="ic"><use href="#i-globe"/></svg><span>Countries</span></a>
    <a href="#/library" data-route="library"><svg class="ic"><use href="#i-library"/></svg><span>Library</span></a>
    <a href="#/playlists" data-route="playlists"><svg class="ic"><use href="#i-list"/></svg><span>Playlists</span></a>
  </nav>

  <!-- Now Playing -->
  <section id="np" class="np" aria-label="Now Playing">
    <div class="np-bg"></div>
    <div class="np-top">
      <button class="icon-btn" data-act="close-np" title="Close"><svg class="ic"><use href="#i-chev-down"/></svg></button>
      <div class="np-label">Now Playing<small class="np-album"></small></div>
      <button class="icon-btn" data-act="menu" title="More"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
    <div class="np-body">
      <div class="np-stage">
        <div class="np-art-wrap">
          <div class="cover np-cover" data-np="cover"><span>♪</span></div>
          <canvas id="viz" class="viz"></canvas>
        </div>
        <div class="np-meta">
          <div class="np-titles">
            <h2 data-np="title"></h2>
            <a class="np-artist" data-np="artist"></a>
          </div>
          <button class="icon-btn like big" data-np="like" data-act="like"><svg class="ic"><use href="#i-heart"/></svg></button>
        </div>
        <div class="np-country" data-np="country"></div>
        <div class="timeline">
          <span data-np="cur">0:00</span>
          <input type="range" class="seek" min="0" max="1000" value="0" aria-label="Position">
          <span data-np="dur">0:00</span>
        </div>
        <div class="controls big">
          <button class="icon-btn" data-act="shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn" data-act="prev"><svg class="ic"><use href="#i-prev"/></svg></button>
          <button class="play-btn" data-act="toggle"><svg class="ic"><use href="#i-play"/></svg></button>
          <button class="icon-btn" data-act="next"><svg class="ic"><use href="#i-next"/></svg></button>
          <button class="icon-btn" data-act="repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="np-tools">
          <button class="icon-btn" data-act="np-tab" data-tab="lyrics" title="Lyrics"><svg class="ic"><use href="#i-lyrics"/></svg></button>
          <button class="icon-btn" data-act="np-tab" data-tab="queue" title="Queue"><svg class="ic"><use href="#i-queue"/></svg></button>
          <button class="icon-btn" data-act="np-tab" data-tab="eq" title="Equalizer & speed"><svg class="ic"><use href="#i-sliders"/></svg></button>
          <button class="icon-btn" data-act="sleep" title="Sleep timer"><svg class="ic"><use href="#i-moon"/></svg></button>
          <div class="np-vol"><button class="icon-btn" data-act="mute"><svg class="ic"><use href="#i-vol"/></svg></button><input type="range" class="vol" min="0" max="100" value="90" aria-label="Volume"></div>
        </div>
      </div>
      <aside class="np-side">
        <div id="np-lyrics" class="np-pane" hidden></div>
        <div id="np-queue" class="np-pane" hidden></div>
        <div id="np-eq" class="np-pane" hidden></div>
      </aside>
    </div>
  </section>

  <!-- Scan progress -->
  <div id="scan" class="scan" hidden>
    <div class="scan-head"><span class="spinner"></span><b id="scan-text">Reading…</b><small id="scan-count"></small></div>
    <div class="scan-track"><i id="scan-bar"></i></div>
  </div>

  <div id="menu" class="menu" hidden></div>
  <div id="dialog" class="dialog" hidden></div>
  <div id="toasts" class="toasts"></div>
  <div class="drop-hint"><div><svg class="ic"><use href="#i-download"/></svg><b>Drop files or a folder here</b></div></div>

  <input id="dir-input" type="file" webkitdirectory directory multiple hidden>
  <input id="file-input" type="file" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav,.aac" multiple hidden>
  <input id="import-input" type="file" accept="application/json,.json" hidden>

  <script src="vendor/jsmediatags.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/artists.js"></script>
  <script src="js/country.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
